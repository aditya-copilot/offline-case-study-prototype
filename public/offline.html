<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Store Navigator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    
    .container {
      text-align: center;
      max-width: 400px;
    }
    
    .icon {
      width: 80px;
      height: 80px;
      margin-bottom: 1.5rem;
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(0.95); }
    }
    
    h1 {
      color: #f8fafc;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    
    p {
      color: #94a3b8;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    
    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }
    
    .feature {
      background: rgba(255, 255, 255, 0.05);
      padding: 1rem;
      border-radius: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .feature-icon {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    
    .feature-text {
      color: #cbd5e1;
      font-size: 0.75rem;
    }
    
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 0.875rem 2rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .btn:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }
    
    .btn:active {
      transform: translateY(0);
    }
    
    .status {
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }
    
    .status-dot.online {
      background: #10b981;
    }
    
    @media (prefers-color-scheme: light) {
      body {
        background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      }
      h1 { color: #0f172a; }
      p { color: #475569; }
      .feature {
        background: rgba(0, 0, 0, 0.05);
        border-color: rgba(0, 0, 0, 0.1);
      }
      .feature-text { color: #334155; }
      .status { color: #64748b; }
    }
  </style>
</head>
<body>
  <div class="container">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a10 10 0 1 0 10 10"/>
      <path d="M12 12 2.1 10.5"/>
      <path d="M6.5 17.5l-1.5 2.5"/>
      <path d="M17.5 17.5l1.5 2.5"/>
      <circle cx="12" cy="12" r="2"/>
    </svg>
    
    <h1>You're Offline</h1>
    <p>Don't worry! Store Navigator works offline. You can still browse products, view your shopping list, and navigate the store.</p>
    
    <div class="features">
      <div class="feature">
        <div class="feature-icon">🗺️</div>
        <div class="feature-text">Store Map</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🛍️</div>
        <div class="feature-text">Products</div>
      </div>
      <div class="feature">
        <div class="feature-icon">📋</div>
        <div class="feature-text">My List</div>
      </div>
    </div>
    
    <button class="btn" onclick="window.location.reload()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
        <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
        <path d="M16 21h5v-5"/>
      </svg>
      Try Again
    </button>
    
    <div class="status">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Checking connection...</span>
    </div>
  </div>
  
  <script>
    function updateStatus() {
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');
      
      if (navigator.onLine) {
        dot.classList.add('online');
        text.textContent = 'Back online! Redirecting...';
        setTimeout(() => window.location.href = '/', 1500);
      } else {
        text.textContent = 'Waiting for connection...';
      }
    }
    
    updateStatus();
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
  </script>
</body>
</html>
